<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi Sitio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body id="arriba"> <!-- Ancla de inicio de página -->

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--primary-color);">
        <div class="container-fluid max-width-container">
            <a class="navbar-brand fw-bold" href="index.html">Mi Sitio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="acerca.html">Acerca</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-container">
        
        <!-- Enlaces requeridos: Externo, Mailto y Ancla interna -->
        <div class="mb-4 text-center">
            <span class="me-3">Enlaces útiles:</span>
            <a href="https://github.com/JORGEL272002" target="_blank" class="btn btn-outline-primary btn-sm me-2">Visitar GitHub</a>
            <a href="mailto:laymejorge82@gmail.com" class="btn btn-outline-secondary btn-sm me-2">Enviar Correo</a>
            <a href="https://layjorge82@gmail.com" target="_blank" class="btn btn-outline-info btn-sm me-2">Visitar Perfil</a>
            <a href="#footer-section" class="btn btn-outline-dark btn-sm">Ir al final </a>
        </div>

        <!-- Tarjeta única combinando Formulario y Multimedia en dos columnas -->
        <div class="card custom-card p-4">
            <h2 class="text-center text-primary mb-4 fw-bold">Contáctenos</h2>
            <div class="row g-4">
                
                <!-- Columna Izquierda: Formulario -->
                <div class="col-md-6 border-end-md">
                    <h4 class="text-secondary h6 text-uppercase fw-bold mb-3">Formulario</h4>
                    <form action="#" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre </label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required minlength="3">
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="correo" name="correo" required>
                        </div>
                        <div class="mb-3">
                            <label for="celular" class="form-label">Celular </label>
                            <input type="tel" class="form-control" id="celular" name="celular" pattern="[0-9]{7,}" required>
                        </div>
                        <div class="mb-3">
                            <label for="motivo" class="form-label">Motivo </label>
                            <select class="form-select" id="motivo" name="motivo" required>
                                <option value="">Selecciona...</option>
                                <option value="consulta">Consulta</option>
                                <option value="reclamo">Reclamo</option>
                                <option value="sugerencia">Sugerencia</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje </label>
                            <textarea class="form-control" id="mensaje" name="mensaje" rows="3" maxlength="300" required></textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="acepta" name="acepta" required>
                            <label class="form-check-label" for="acepta">Acepto los términos y condiciones</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar</button>
                        <button type="reset" class="btn btn-secondary">Limpiar</button>
                    </form>
                </div>

                <!-- Columna Derecha: Multimedia -->
                <div class="col-md-6">
                    <h4 class="text-secondary h6 text-uppercase fw-bold mb-3">Multimedia</h4>
                    <video class="w-100 rounded mb-3" controls poster="medios/portada.jpg">
                        <source src="videos/video.mp4" type="video/mp4">
                        Tu navegador no soporta el elemento de video.
                    </video>
                    <audio class="w-100" controls>
                        <source src="medios/audio.mp3" type="audio/mpeg">
                        Tu navegador no soporta el elemento de audio.
                    </audio>
                </div>

            </div>
        </div>
    </main>

    <footer id="footer-section" class="site-footer">
        <p class="site-footer__text">&copy; 2026 Mi Sitio Web | Todos los derechos reservados. | jorge layme.</p>
        <a href="#arriba" class="text-light text-decoration-underline small mt-1 d-block">Volver arriba</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
