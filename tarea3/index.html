<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lista de Tareas Moderna</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Contenedor que centra y da forma de tarjeta -->
<div class="contenedor-principal">
    <h2>Mi Lista de Tareas</h2>
    
    <form id="form-tarea">
        <input type="text" id="input-tarea" placeholder="¿Qué quieres hacer hoy?" required>
        <button type="submit">Agregar</button>
    </form>
    
    <ul id="lista-tareas"></ul>
    <p id="contador"></p>
</div>

<script src="app.js"></script>
</body>
</html>°
