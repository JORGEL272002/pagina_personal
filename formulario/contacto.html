<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: Arial, sans-serif; 
            background: #d2ced3; 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal estilo tarjeta */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 850px;
            width: 100%;
            overflow: hidden;
        }

        /* Encabezado superior azul */
        .card-header {
            background-color: #1b365d;
            color: white;
            text-align: center;
            padding: 12px 20px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 20px;
        }

        /* Cuerpo en dos columnas con Flexbox */
        .card-body {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
        }

        /* Columna Izquierda: Formulario */
        .col-formulario {
            flex: 1;
            min-width: 280px;
            padding-right: 15px;
            border-right: 1px dashed #ccc; /* Línea divisoria de la maqueta */
        }

        /* Columna Derecha: Multimedia */
        .col-multimedia {
            flex: 1;
            min-width: 280px;
            padding-left: 10px;
        }

        .section-title {
            color: #2980b9;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
            margin-top: 0;
        }

        /* Estilos de las filas de formulario */
        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 13px;
            color: #333;
            width: 40%;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group select,
        .form-group textarea {
            width: 58%;
            padding: 6px;
            border: 1px solid #777;
            border-radius: 3px;
            font-size: 13px;
        }

        /* Fila de Acepto términos */
        .form-checkbox {
            display: flex;
            align-items: center;
            margin-top: 10px;
            font-size: 13px;
        }

        .form-checkbox input {
            margin-right: 8px;
        }

        /* Botones del Formulario */
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }

        button { 
            padding: 6px 16px; 
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            color: white;
        }

        button[type="submit"] {
            background-color: #2980b9;
        }

        button[type="reset"] {
            background-color: #7f8c8d;
        }

        /* Estilos de la multimedia */
        .col-multimedia video {
            width: 100%;
            border-radius: 30px;
            background-color: #000;
        }

        .col-multimedia audio {
            width: 100%;
            margin-top: 15px;
        }

        .multimedia-desc {
            text-align: center;
            font-size: 12px;
            color: #555;
            margin-top: 8px;
        }

        /* Diseño responsivo para pantallas pequeñas */
        @media (max-width: 650px) {
            .card-body {
                flex-direction: column;
            }

            .col-formulario {
                border-right: none;
                border-bottom: 1px dashed #ccc;
                padding-right: 0;
                padding-bottom: 20px;
            }

            .col-multimedia {
                padding-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Encabezado superior -->
        <div class="card-header">
            <h2>Contáctenos</h2>
        </div>

        <!-- Contenido dividido en 2 columnas -->
        <div class="card-body">
            
            <!-- COLUMNA IZQUIERDA: FORMULARIO -->
            <div class="col-formulario">
                <div class="section-title">Formulario</div>
                
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="nombre">Nombre </label>
                        <input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Escribe tu nombre">
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo </label>
                        <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="celular">Celular </label>
                        <input type="tel" id="celular" name="celular" pattern="[0-9]{7,}" required placeholder="Mínimo 7 dígitos">
                    </div>

                    <div class="form-group">
                        <label for="motivo">Motivo</label>
                        <select id="motivo" name="motivo" required>
                            <option value="">Selecciona...</option>
                            <option value="consulta">Consulta</option>
                            <option value="reclamo">Reclamo</option>
                            <option value="sugerencia">Sugerencia</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="3" maxlength="300" required placeholder="Escribe tu mensaje..."></textarea>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="acepta" name="acepta" required>
                        <label for="acepta" style="width: auto;">Acepto los términos y condiciones</label>
                    </div>

                    <div class="buttons">
                        <button type="submit">Enviar</button>
                        <button type="reset">Limpiar</button>
                    </div>
                </form>
            </div>

            <!-- COLUMNA DERECHA: MULTIMEDIA -->
            <div class="col-multimedia">
                <div class="section-title">Multimedia</div>
                
                <!-- Reproductor de Video con poster y 2 fuentes -->
                <video controls poster="medios/red.jpg">
                    <source src="medios/Download (1).mp4" type="video/mp4">
                    Tu navegador no soporta el elemento de video.
                </video>

                <p class="multimedia-desc"><em>Video y audio interactivo</em></p>
            </div>

        </div>
    </div>

</body>
</html>
